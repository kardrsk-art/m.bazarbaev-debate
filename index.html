<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>МБ 138 · Дебат клубы</title>
<style>
:root{--or:#e85500;--navy:#0b3a8c;--bg:#fff;--bg2:#f4f6fb;--tx:#10172a;--mut:#5b6478;--card:#fff;--bd:#dde3f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1220;--bg2:#131a2e;--tx:#eef1f8;--mut:#a3adc4;--card:#182038;--bd:#27314f;--navy:#6f9bff;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
nav .w{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--tx);text-decoration:none;white-space:nowrap}
.nb{width:42px;height:42px;border-radius:50%}
.nr{display:flex;align-items:center;gap:6px}
nav a.l{color:var(--mut);text-decoration:none;margin-right:10px;font-size:14px;font-weight:600}nav a.l:hover{color:var(--or)}
.lang{display:flex;border:1px solid var(--bd);border-radius:99px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--mut);font-weight:700;font-size:12px;padding:6px 9px;cursor:pointer}
.lang button.on{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.lang button.on{color:#0d1220}}
.btn{display:inline-block;background:var(--or);color:#fff;border:0;padding:13px 24px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;margin:10px 10px 0 0;font-family:inherit}
.btn.o{background:transparent;border:2px solid #fff}.btn.sm{padding:8px 14px;font-size:13px;margin:0;border-radius:10px}
.hero{background:linear-gradient(135deg,#0b3a8c,#082a68);color:#fff;padding:72px 0 80px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;border:34px solid var(--or);opacity:.9}
.hero .w{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:30px}.hero .txt{flex:1}
.tag{display:inline-block;background:var(--or);color:#fff;font-weight:700;font-size:12px;padding:5px 12px;border-radius:99px;letter-spacing:.04em}
h1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:16px 0 14px;max-width:640px}.hero p{max-width:520px;opacity:.9;font-size:17px}
.heroLogo{width:min(34vw,300px);height:min(34vw,300px);border-radius:50%;flex:none;box-shadow:0 20px 60px rgba(0,0,0,.45);opacity:0}
section{padding:60px 0}section.alt{background:var(--bg2)}
h2{font-size:30px;margin:0 0 6px}h2 span{color:var(--or)}.sub{color:var(--mut);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(11,58,140,.18)}
.ev{display:flex;gap:14px}.date{min-width:62px;text-align:center;border-radius:12px;background:var(--or);color:#fff;padding:8px 4px;height:fit-content}
.date b{display:block;font-size:24px;line-height:1}.date small{font-size:12px;text-transform:uppercase}
.ev h3{margin:0 0 4px;font-size:17px}.ev p{margin:0;color:var(--mut);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;color:var(--navy);background:var(--bg2);border-radius:99px;padding:3px 10px;margin:8px 8px 0 0}
.tip{position:relative;padding-top:42px}.tip i{position:absolute;top:-14px;left:18px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-style:normal}
@media (prefers-color-scheme:dark){.tip i{color:#0d1220}}
.tip h3{margin:0 0 4px}.tip p{margin:0;color:var(--mut);font-size:14px}
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:34px}
.q{border-radius:18px;padding:26px 22px;min-height:170px;display:flex;align-items:flex-end;color:#fff;font-weight:800;font-size:19px;line-height:1.3;position:relative;overflow:hidden}
.q:before{content:"“";position:absolute;top:-18px;left:14px;font-size:110px;opacity:.25;font-family:Georgia,serif}
.q:nth-child(1){background:linear-gradient(135deg,#e85500,#ff9446)}.q:nth-child(2){background:linear-gradient(135deg,#0b3a8c,#2f6bdc)}
.q:nth-child(3){background:linear-gradient(135deg,#082a68,#e85500)}.q:nth-child(4){background:linear-gradient(135deg,#ff9446,#0b3a8c)}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.modes button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.modes button.on{background:var(--navy);border-color:var(--navy);color:#fff}@media (prefers-color-scheme:dark){.modes button.on{color:#0d1220}}
.chat{background:var(--card);border:1px solid var(--bd);border-radius:16px;height:380px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;font-size:15px}
.m.ai{background:var(--bg2);align-self:flex-start;border-bottom-left-radius:4px}.m.me{background:var(--or);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.row{display:flex;gap:8px}.row .btn{margin:0}
.f{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.row .f{flex:1;min-width:0}.lb{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:0 0 5px}
.team{display:flex;align-items:center;gap:16px}.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--or));color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.team h3{margin:0}.team p{margin:2px 0 0;color:var(--mut);font-size:14px}
footer{background:#082a68;color:#cfd8f0;padding:30px 0;font-size:14px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(5,15,40,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mod{background:var(--bg);color:var(--tx);border-radius:20px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative}
.mod h3{margin:0 0 14px;font-size:22px}.x{position:absolute;top:10px;right:14px;border:0;background:transparent;color:var(--mut);font-size:28px;cursor:pointer}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .full{grid-column:1/-1}
.ck{display:block;padding:5px 0;font-size:14px}.ck input{accent-color:var(--or);margin-right:6px}
#rst{margin-top:12px;font-weight:600}#rst a{color:var(--or)}
.lgb{display:grid;gap:10px;margin-top:6px}.lgb button{padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}.lgb button:hover{border-color:var(--or)}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 45%,#0f4cb8,#06204f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s ease,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash .big{width:min(60vw,260px);height:min(60vw,260px);border-radius:50%;animation:pop 1.2s cubic-bezier(.2,1.3,.4,1) both,glow 2s ease-in-out .8s infinite}
#splash .ring{position:absolute;width:min(72vw,320px);height:min(72vw,320px);border-radius:50%;border:4px solid var(--or);border-top-color:transparent;animation:spin 1.6s linear infinite}
#splash .stage{position:relative;display:grid;place-items:center}
#splash h2{color:#fff;margin:0;font-size:22px;letter-spacing:.12em;animation:up .8s .6s both}#splash p{color:#ffd2b3;margin:-12px 0 0;font-size:14px;letter-spacing:.2em;animation:up .8s .9s both}
.pt{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;opacity:0;animation:burst 1.5s .55s ease-out forwards}
@keyframes pop{0%{transform:scale(.1) rotate(-240deg);opacity:0}55%{transform:scale(1.22) rotate(10deg);opacity:1}75%{transform:scale(.92) rotate(-3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.2)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(232,85,0,.5)}50%{box-shadow:0 0 70px rgba(232,85,0,.95)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(3deg)}}
body.ready .heroLogo{opacity:1;animation:pop 1s .2s both,float 5s 1.4s ease-in-out infinite}
.hero .txt>*{opacity:0}body.ready .hero .txt>*{animation:up .8s both}
body.ready .hero .txt>*:nth-child(2){animation-delay:.2s}body.ready .hero .txt>*:nth-child(3){animation-delay:.35s}body.ready .hero .txt>*:nth-child(4){animation-delay:.5s}
.rv{opacity:0;transform:translateY(30px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
@media(max-width:700px){nav a.l{display:none}.hero .w{flex-direction:column-reverse;align-items:flex-start}.heroLogo{width:150px;height:150px}.hero:after{width:200px;height:200px;border-width:22px}.logo span{display:none}.fg{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

const DAY=["24","07","21"],MODE_IDS=["topic","argument","rebuttal","sparring"];

 lang=l;try{localStorage.setItem("lang",l)}catch(e){}
 document.documentElement.lang=l;

 const tg=$("tipgrid");tg.textContent="";
 T("tips").forEach((t,i)=>{const c=document.createElement("div");c.className="card tip";c.innerHTML="<i></i><h3></h3><p></p>";c.querySelector("i").textContent=i+1;c.querySelector("h3").textContent=t[0];c.querySelector("p").textContent=t[1];tg.appendChild(c)});
 const qs=$("qs");qs.textContent="";T("q").forEach(q=>{const d=document.createElement("div");d.className="q";d.textContent=q;qs.appendChild(d)});

 if(!hist.length){$("chat").textContent="";add(T("hi"),"ai")}

 const box=$("evbox"),chk=[...box.querySelectorAll("input")].map(x=>x.checked);box.textContent="";
 T("ev").forEach((e,i)=>{const lb=document.createElement("label");lb.className="ck";const c=document.createElement("input");c.type="checkbox";c.dataset.i=i;c.checked=!!chk[i];lb.appendChild(c);lb.append(e[0]+" · "+DAY[i]+" "+T("mon")[i]);box.appendChild(lb)});

function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}
async function go(){
 const v=$("in").value.trim();if(!v||busy)return;$("in").value="";add(v,"me");hist.push({role:"user",content:v});
 const out=add(T("think"),"ai");busy=true;
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:MODE_IDS[mode],lang:lang,messages:hist})});
  if(!r.ok){let d="";try{d=(await r.json()).error||""}catch(x){}throw {d:"HTTP "+r.status+(d?" · "+d:"")}}const j=await r.json();out.textContent=j.text;hist.push({role:"assistant",content:j.text});
 }catch(e){out.textContent=T("err")+(e&&e.d?"\n("+e.d+")":"");hist.pop()}
 busy=false;
}
